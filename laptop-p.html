<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Bazar</title>
    <link rel="shortcut icon" href="logo1.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <!-- Product Section -->
    <section class="products py-12">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold mb-8 text-center">Products</h2>
            <div class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-4">
                <!-- Product 1 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop1.jpg" alt="Product 1" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 1</h3>
                    <p class="text-gray-300 mb-4">$499.99</p>
                    <button onclick="addToCart('Laptop 1', 499.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 2 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop2.jpg" alt="Product 2" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 2</h3>
                    <p class="text-gray-300 mb-4">$599.99</p>
                    <button onclick="addToCart('Laptop 2', 599.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 3 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop3.jpg" alt="Product 3" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 3</h3>
                    <p class="text-gray-300 mb-4">$699.99</p>
                    <button onclick="addToCart('Laptop 3', 699.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 4 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop4.jpg" alt="Product 4" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 4</h3>
                    <p class="text-gray-300 mb-4">$799.99</p>
                    <button onclick="addToCart('Laptop 4', 799.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 1 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop1.jpg" alt="Product 1" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 5</h3>
                    <p class="text-gray-300 mb-4">$499.99</p>
                    <button onclick="addToCart('Laptop 1', 499.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 2 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop2.jpg" alt="Product 2" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 6</h3>
                    <p class="text-gray-300 mb-4">$599.99</p>
                    <button onclick="addToCart('Laptop 2', 599.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 3 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop3.jpg" alt="Product 3" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 7</h3>
                    <p class="text-gray-300 mb-4">$699.99</p>
                    <button onclick="addToCart('Laptop 3', 699.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
                <!-- Product 4 -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <img src="laptop4.jpg" alt="Product 4" class="w-full h-48 object-cover mb-4 rounded">
                    <h3 class="text-xl font-semibold mb-2">Laptop 8</h3>
                    <p class="text-gray-300 mb-4">$799.99</p>
                    <button onclick="addToCart('Laptop 4', 799.99)" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Cart Summary Section -->
    <section class="cart-summary py-12 bg-gray-800 hidden" id="cart-summary-section">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold mb-8 text-center">Cart Summary</h2>
            <div id="cart-items" class="space-y-4"></div>
            <div class="flex justify-between mt-6">
                <span class="text-xl font-bold">Total:</span>
                <span id="total-amount" class="text-xl font-bold">$0.00</span>
            </div>
            <button onclick="proceedToOrder()" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none mt-4">Proceed to Order</button>
        </div>
    </section>

    <!-- Order Section -->
    <section class="order-section py-12 bg-gray-800 hidden" id="order-section">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold mb-8 text-center">Order Details</h2>
            <form id="order-form" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium mb-2">Name</label>
                    <input type="text" id="name" name="name" class="w-full p-3 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500" required>
                </div>
                <div>
                    <label for="address" class="block text-sm font-medium mb-2">Address</label>
                    <input type="text" id="address" name="address" class="w-full p-3 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500" required>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="email" name="email" class="w-full p-3 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500" required>
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium mb-2">Phone</label>
                    <input type="text" id="phone" name="phone" class="w-full p-3 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500" required>
                </div>
                
                <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 focus:outline-none mt-4">Place Order</button>
            </form>
        </div>
    </section>



    

    <script>
        const cart = [];

        function addToCart(productName, productPrice) {
            const product = { name: productName, price: productPrice, quantity: 1 };
            const existingProduct = cart.find(item => item.name === productName);
            if (existingProduct) {
                existingProduct.quantity++;
            } else {
                cart.push(product);
            }
            updateCartUI();
            document.getElementById('cart-summary-section').classList.remove('hidden');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';

            let totalAmount = 0;

            cart.forEach((item, index) => {
                totalAmount += item.price * item.quantity;
                cartItemsContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-700 p-4 rounded-lg">
                        <span>${item.name} x ${item.quantity}</span>
                        <div class="flex items-center">
                            <span class="mr-4">$${(item.price * item.quantity).toFixed(2)}</span>
                            <button onclick="removeFromCart(${index})" class="bg-red-500 text-white py-1 px-3 rounded hover:bg-red-600 focus:outline-none">Remove</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-amount').textContent = `$${totalAmount.toFixed(2)}`;
        }

        function proceedToOrder() {
            document.getElementById('cart-summary-section').classList.add('hidden');
            document.getElementById('order-section').classList.remove('hidden');
        }

        document.getElementById('order-form').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Order placed successfully');
        });





       
    </script>
</body>
</html>
